<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة طلبات لورا</title>
<style>
:root{--bg:#F3F6F7;--ink:#12201D;--mute:#5A6B68;--card:#fff;--line:#D9E2E4;--navy:#0B1426;--gold:#D4A84B;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0A101C;--ink:#EAF0F7;--mute:#9AA9BF;--card:#121A2A;--line:#243049}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 4vw;display:flex;justify-content:space-between;align-items:center;gap:8px}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px}
button{cursor:pointer}header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:900px;margin:auto;padding:20px 4vw 60px}
#login{max-width:340px;margin:12vh auto;display:grid;gap:10px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.o{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800}
.mut{color:var(--mute);font-size:.9rem}
.items{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:.95rem}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ctl input[type=number]{width:90px}.ctl .nt{flex:1;min-width:150px}
.save{background:var(--navy);color:#fff;border-color:var(--navy)}
.wa{background:#0E7A3E;color:#fff;border-color:#0E7A3E}
.tag{display:inline-block;background:var(--gold);color:var(--navy);border-radius:999px;padding:0 12px;font-size:.85rem;font-weight:800}
a{color:inherit}
#msg{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:9px 20px;border-radius:999px;opacity:0;transition:opacity .3s}
#msg.on{opacity:1}
</style>
</head>
<body>
<header><b>لوحة طلبات لورا</b><div><button id="rf" hidden>تحديث</button> <button id="lo" hidden>خروج</button></div></header>
<main>
  <form id="login"><h2>دخول</h2><input id="k" type="password" placeholder="كلمة سر اللوحة" required autocomplete="current-password"><button type="submit">دخول</button><p class="mut" id="err"></p></form>
  <div id="app" hidden>
    <div class="bar"><select id="flt" aria-label="فلترة بالحالة"></select><span class="mut" id="cnt"></span></div>
    <div id="list"></div>
  </div>
</main>
<div id="msg" role="status"></div>
<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbymqUvw-_sWGgxWjAiaiByI3tjAl0Qf4WggwJiUkpXgnPA0RD2qSrwPJX_GPZMVjpdEUA/exec"; // الصق هنا رابط Apps Script
var ST=["جديد","تم الاستلام","جاري التجهيز","تم الشحن","تم التسليم","ملغي"];
var key="",all=[];
var $=function(i){return document.getElementById(i)};
function toast(t){var m=$("msg");m.textContent=t;m.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){m.classList.remove("on")},2000)}
function load(){
  return fetch(SCRIPT_URL+"?action=list&key="+encodeURIComponent(key)).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw 0;all=j.orders;draw()});
}
function draw(){
  var f=$("flt").value,L=$("list");L.innerHTML="";
  var rows=all.filter(function(o){return !f||o.status===f});
  $("cnt").textContent=rows.length+" طلب";
  if(!rows.length){L.textContent="مفيش طلبات.";return}
  rows.forEach(function(o){
    var d=document.createElement("div");d.className="o";
    var t=document.createElement("div");t.className="top";
    var a=document.createElement("span");a.textContent=o.code+" · "+Number(o.total).toLocaleString("ar-EG")+" ج.م";
    var s=document.createElement("span");s.className="tag";s.textContent=o.status;
    t.append(a,s);
    var c=document.createElement("div");c.className="mut";
    c.textContent=new Date(o.created).toLocaleString("ar-EG")+" · "+o.name+" · "+o.phone+" · "+o.address+(o.notes?" · ملاحظات: "+o.notes:"");
    var it=document.createElement("div");it.className="items";it.textContent=o.items;
    var ct=document.createElement("div");ct.className="ctl";
    var sel=document.createElement("select");sel.setAttribute("aria-label","حالة الطلب");
    ST.forEach(function(x){var op=document.createElement("option");op.textContent=x;if(x===o.status)op.selected=true;sel.appendChild(op)});
    var dy=document.createElement("input");dy.type="number";dy.min="0";dy.placeholder="أيام التوصيل";dy.value=o.days;dy.setAttribute("aria-label","عدد أيام التوصيل");
    var nt=document.createElement("input");nt.className="nt";nt.placeholder="ملاحظة للعميل";nt.value=o.note;
    var sv=document.createElement("button");sv.className="save";sv.textContent="حفظ";
    var wa=document.createElement("button");wa.className="wa";wa.textContent="ابعت للعميل واتساب";
    sv.onclick=function(){
      sv.disabled=true;
      fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"update",key:key,code:o.code,status:sel.value,days:dy.value,note:nt.value})})
        .then(function(r){return r.json()}).then(function(j){sv.disabled=false;if(!j.ok)throw 0;o.status=sel.value;o.days=dy.value;o.note=nt.value;s.textContent=o.status;toast("تم الحفظ")})
        .catch(function(){sv.disabled=false;toast("حصلت مشكلة، حاول تاني")});
    };
    wa.onclick=function(){
      var p=String(o.phone).replace(/\D/g,"");if(p.charAt(0)==="0")p="20"+p.slice(1);
      var m="أهلاً "+o.name+"، طلبك رقم "+o.code+" من لورا ونتر حالته: "+sel.value+"."+(dy.value&&sel.value!=="تم التسليم"&&sel.value!=="ملغي"?" هيوصلك خلال "+dy.value+" أيام.":"")+(nt.value?" "+nt.value:"")+"\nتتابع طلبك من الموقع بالرقم ده وآخر ٤ أرقام من موبايلك.";
      window.open("https://wa.me/"+p+"?text="+encodeURIComponent(m),"_blank","noopener");
    };
    ct.append(sel,dy,nt,sv,wa);
    d.append(t,c,it,ct);L.appendChild(d);
  });
}
var fl=$("flt");[["","كل الطلبات"]].concat(ST.map(function(x){return [x,x]})).forEach(function(x){var o=document.createElement("option");o.value=x[0];o.textContent=x[1];fl.appendChild(o)});
fl.onchange=draw;
function enter(){$("login").hidden=true;$("app").hidden=false;$("rf").hidden=false;$("lo").hidden=false}
$("login").onsubmit=function(e){
  e.preventDefault();
  if(!SCRIPT_URL){$("err").textContent="لازم تحط SCRIPT_URL في الملف الأول.";return}
  key=$("k").value;$("err").textContent="جاري الدخول...";
  load().then(function(){$("err").textContent="";enter()}).catch(function(){$("err").textContent="كلمة السر غلط أو الرابط مش شغال."});
};
$("rf").onclick=function(){load().then(function(){toast("تم التحديث")}).catch(function(){toast("فشل التحديث")})};
$("lo").onclick=function(){location.reload()};
</script>
</body>
</html>
