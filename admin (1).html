<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة طلبات لورا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<style>
:root{--bg:#070D1B;--bg2:#0D1730;--card:rgba(255,255,255,.055);--card-b:rgba(255,255,255,.11);--ink:#EAF1FA;--mute:#93A4BE;--gold:#E2B857;--gold2:#F6DC98;--ice:#7FD6E8;--navy:#0B1426;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 85% -10%,#16305a55,transparent),radial-gradient(900px 500px at 0% 110%,#2a1f5a44,transparent),var(--bg);color:var(--ink);font:16px/1.65 Cairo,Tahoma,Arial,sans-serif;min-height:100vh}
button,input{font:inherit;color:var(--ink)}
input{background:rgba(255,255,255,.07);border:1.5px solid var(--card-b);border-radius:12px;padding:9px 14px;transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder{color:#7283a0}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(226,184,87,.18);background:rgba(255,255,255,.1)}
button{cursor:pointer;border:1.5px solid var(--card-b);background:rgba(255,255,255,.07);border-radius:12px;padding:9px 16px;font-weight:700;transition:transform .15s,background .2s,box-shadow .2s,opacity .2s}
button:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.14)}
button:active:not(:disabled){transform:translateY(0) scale(.97)}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ===== Login ===== */
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#loginWrap{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:2;overflow:hidden}
.aurora{position:absolute;inset:-20%;z-index:-1;filter:blur(70px);opacity:.75}
.aurora i{position:absolute;border-radius:50%;animation:drift 14s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vmax;height:46vmax;background:#1d4f9a;top:-10%;right:-5%}
.aurora i:nth-child(2){width:38vmax;height:38vmax;background:#6b3fa8;bottom:-12%;left:-8%;animation-delay:-5s;animation-duration:18s}
.aurora i:nth-child(3){width:28vmax;height:28vmax;background:#e2b85766;top:35%;left:35%;animation-delay:-9s;animation-duration:22s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.18)}}
#login{width:min(400px,100%);display:grid;gap:14px;padding:34px 28px;border-radius:26px;background:rgba(13,23,48,.62);border:1px solid var(--card-b);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.96)}}
.logo{width:68px;height:68px;margin:0 auto;border-radius:20px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#b98b2c);color:var(--navy);box-shadow:0 10px 30px rgba(226,184,87,.4);animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-4deg)}}
#login h1{font-size:1.6rem;font-weight:900;text-align:center;background:linear-gradient(90deg,var(--gold2),#fff,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
#login .sub{text-align:center;color:var(--mute);font-size:.92rem;margin-top:-8px}
.pw{position:relative}
.pw input{width:100%;padding-inline-end:48px}
.eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%)!important;background:none;border:0;padding:6px 10px;font-size:1.1rem}
.go{background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#c99a38);color:var(--navy);border:0;padding:12px;font-size:1.05rem;font-weight:900;box-shadow:0 8px 24px rgba(226,184,87,.35);position:relative;overflow:hidden}
.go:hover:not(:disabled){background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#c99a38);box-shadow:0 12px 30px rgba(226,184,87,.5)}
.go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{left:130%}}
#err{white-space:pre-wrap;word-break:break-word;direction:rtl;min-height:1.5em;text-align:center;font-size:.92rem;color:var(--mute)}
#err.bad{color:#ff8a8a;animation:shake .45s}
@keyframes shake{25%{transform:translateX(7px)}50%{transform:translateX(-7px)}75%{transform:translateX(4px)}}

/* ===== App ===== */
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4vw;background:rgba(7,13,27,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--card-b)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem}
.brand .logo{width:38px;height:38px;border-radius:12px;font-size:19px;margin:0;animation:none}
header .act{display:flex;gap:8px}
#rf.spin span{display:inline-block;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(-360deg)}}
main{max-width:980px;margin:auto;padding:22px 4vw 80px;position:relative;z-index:1}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--card);border:1.5px solid var(--card-b);--c:var(--gold)}
.chip b{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--c);color:#0B1426;font-size:.85rem}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.tools{display:flex;gap:12px;align-items:center;margin:4px 0 18px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px}
.mut{color:var(--mute);font-size:.9rem}
.o{--c:var(--gold);position:relative;overflow:hidden;background:var(--card);border:1px solid var(--card-b);border-radius:20px;padding:18px 20px 16px;margin-bottom:16px;backdrop-filter:blur(8px);transition:transform .25s,border-color .25s,box-shadow .25s;animation:in .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.o::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--c);box-shadow:0 0 18px var(--c)}
.o:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 18px 40px rgba(0,0,0,.35)}
@keyframes in{from{opacity:0;transform:translateY(24px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.top>span:first-child{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code{font-weight:900;font-size:1.1rem}
.price{color:var(--gold2);font-weight:900}
.tag{display:inline-block;background:var(--c);color:#0B1426;border-radius:999px;padding:1px 14px;font-size:.85rem;font-weight:900}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 18px;margin:10px 0}
.meta div{color:var(--mute);font-size:.92rem}
.meta b{color:var(--ink);font-weight:600}
.meta a{color:var(--ice);text-decoration:none}
.items{white-space:pre-wrap;background:rgba(0,0,0,.28);border:1px dashed var(--card-b);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.steps{display:flex;align-items:center;margin:14px 2px 6px}
.st{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.14);flex:0 0 auto;transition:.4s}
.st.d{background:var(--c);box-shadow:0 0 10px var(--c)}
.st.now{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 12px transparent}}
.ln{flex:1;height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.ln i{display:block;height:100%;width:0;background:var(--c);transition:width .6s}
.ln.d i{width:100%}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ctl select{background:rgba(255,255,255,.08);color:var(--ink);border:1.5px solid var(--card-b);border-radius:12px;padding:9px 12px;font:inherit;transition:border-color .2s}
.ctl select option{background:#0D1730;color:#fff}
.ctl select:focus{outline:none;border-color:var(--gold)}
.ctl input[type=number]{width:110px}
.ctl .nt{flex:1;min-width:150px}
.save{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);border:0}
.save:hover:not(:disabled){background:linear-gradient(135deg,var(--gold2),var(--gold))!important;box-shadow:0 8px 20px rgba(226,184,87,.4)}
.wa{background:linear-gradient(135deg,#25D366,#0E8F46);color:#fff;border:0}
.wa:hover:not(:disabled){background:linear-gradient(135deg,#25D366,#0E8F46)!important;box-shadow:0 8px 20px rgba(37,211,102,.35)}
.empty{text-align:center;padding:60px 20px;color:var(--mute);animation:in .6s both}
.empty .big{font-size:3rem;animation:float 3.5s ease-in-out infinite}
.sk{height:150px;border-radius:20px;margin-bottom:16px;background:linear-gradient(100deg,var(--card) 30%,rgba(255,255,255,.12) 50%,var(--card) 70%);background-size:300% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-300% 0}}
#msg{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);font-weight:800;padding:10px 24px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(20px);transition:.35s;pointer-events:none;z-index:50}
#msg.on{opacity:1;transform:none}
#msg.bad{background:#ff7b7b;color:#2a0505}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas>

<div id="loginWrap">
  <div class="aurora"><i></i><i></i><i></i></div>
  <form id="login" autocomplete="on">
    <div class="logo">❄</div>
    <h1>لوحة طلبات لورا</h1>
    <p class="sub">سجّل دخولك لمتابعة الطلبات وتحديث حالتها</p>
    <div class="pw">
      <input id="k" type="password" placeholder="كلمة سر اللوحة" required autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="كلمة السر">
      <button type="button" class="eye" id="eye" aria-label="إظهار كلمة السر">👁</button>
    </div>
    <button type="submit" class="go" id="go">دخول</button>
    <p id="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><div class="logo">❄</div><span>لوحة طلبات لورا</span></div>
    <div class="act"><button id="rf" type="button"><span>⟳</span> تحديث</button><button id="lo" type="button">خروج</button></div>
  </header>
  <main>
    <div class="chips" id="chips"></div>
    <div class="tools"><input id="q" type="search" placeholder="ابحث بالاسم أو الموبايل أو كود الطلب" aria-label="بحث"><span class="mut" id="cnt"></span></div>
    <div id="list"></div>
  </main>
</div>
<div id="msg" role="status"></div>

<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbymqUvw-_sWGgxWjAiaiByI3tjAl0Qf4WggwJiUkpXgnPA0RD2qSrwPJX_GPZMVjpdEUA/exec";
var ST=["جديد","تم الاستلام","جاري التجهيز","تم الشحن","تم التسليم","ملغي"];
var COL={"جديد":"#E2B857","تم الاستلام":"#5BA8FF","جاري التجهيز":"#A78BFA","تم الشحن":"#4FD1C5","تم التسليم":"#4ADE80","ملغي":"#FF7B7B"};
var key="",all=[],cur="",$=function(i){return document.getElementById(i)};
function S(v){return v==null?"":String(v)}

function toast(t,bad){var m=$("msg");m.textContent=t;m.className="on"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(function(){m.className=""},2200)}

/* قراءة آمنة للرد: لو مش JSON نعرف إن المشكلة في الرابط/النشر */
function api(url,opts){
  return fetch(url,opts).then(function(r){
    return r.text().then(function(t){
      try{return JSON.parse(t)}
      catch(e){var x=new Error("net");x.kind="net";x.detail="الرد مش JSON (HTTP "+r.status+"): "+t.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,140);throw x}
    });
  },function(e){var x=new Error("net");x.kind="net";x.detail="الطلب اتمنع أو مفيش نت: "+(e&&e.message||e);throw x});
}
function load(){
  return api(SCRIPT_URL+"?action=list&key="+encodeURIComponent(key)).then(function(j){
    if(!j||!j.ok){var x=new Error("auth");x.kind="auth";x.detail="رد السيرفر: "+JSON.stringify(j).slice(0,140);throw x}
    all=Array.isArray(j.orders)?j.orders:[];draw();
  });
}

function drawChips(){
  var c=$("chips");c.innerHTML="";
  [""].concat(ST).forEach(function(s){
    var n=s?all.filter(function(o){return o.status===s}).length:all.length;
    var b=document.createElement("button");b.type="button";b.className="chip"+(cur===s?" on":"");
    b.style.setProperty("--c",s?COL[s]:"#E2B857");
    var l=document.createElement("span");l.textContent=s||"الكل";
    var k=document.createElement("b");k.textContent=n.toLocaleString("ar-EG");
    b.append(l,k);b.onclick=function(){cur=s;draw()};c.appendChild(b);
  });
}

function stepper(status,color){
  var w=document.createElement("div");w.className="steps";w.style.setProperty("--c",color);
  var idx=ST.indexOf(status);if(idx>4)idx=-1;
  for(var i=0;i<5;i++){
    if(i){var ln=document.createElement("div");ln.className="ln"+(i<=idx?" d":"");ln.appendChild(document.createElement("i"));w.appendChild(ln)}
    var d=document.createElement("div");d.className="st"+(i<=idx?" d":"")+(i===idx?" now":"");w.appendChild(d);
  }
  return w;
}

function draw(){
  drawChips();
  var L=$("list");L.innerHTML="";
  var q=$("q").value.trim().toLowerCase();
  var rows=all.filter(function(o){
    if(cur&&o.status!==cur)return false;
    if(!q)return true;
    return (S(o.code)+" "+S(o.name)+" "+S(o.phone)).toLowerCase().indexOf(q)>-1;
  });
  $("cnt").textContent=rows.length.toLocaleString("ar-EG")+" طلب";
  if(!rows.length){
    var e=document.createElement("div");e.className="empty";
    e.innerHTML='<div class="big">📭</div>';
    var p=document.createElement("p");p.textContent=all.length?"مفيش طلبات مطابقة. جرّب فلتر تاني أو امسح البحث.":"مفيش طلبات لسه. هتظهر هنا أول ما يوصل طلب جديد.";
    e.appendChild(p);L.appendChild(e);return;
  }
  rows.forEach(function(o,n){
    var col=COL[o.status]||"#E2B857";
    var d=document.createElement("div");d.className="o";d.style.setProperty("--c",col);d.style.setProperty("--i",Math.min(n,10));
    var t=document.createElement("div");t.className="top";
    var a=document.createElement("span");
    var cd=document.createElement("span");cd.className="code";cd.textContent=S(o.code);
    var pr=document.createElement("span");pr.className="price";pr.textContent=Number(o.total||0).toLocaleString("ar-EG")+" ج.م";
    a.append(cd,pr);
    var s=document.createElement("span");s.className="tag";s.textContent=S(o.status);
    t.append(a,s);

    var m=document.createElement("div");m.className="meta";
    function row(lbl,val,link){
      if(!val)return;var r=document.createElement("div");var b=document.createElement("b");
      if(link){var an=document.createElement("a");an.href=link;an.textContent=val;b.appendChild(an)}else b.textContent=val;
      r.append(lbl+": ",b);m.appendChild(r);
    }
    var dt=new Date(o.created);
    row("التاريخ",isNaN(dt)?S(o.created):dt.toLocaleString("ar-EG"));
    row("العميل",S(o.name));
    row("الموبايل",S(o.phone),"tel:"+S(o.phone).replace(/[^\d+]/g,""));
    row("العنوان",S(o.address));
    row("ملاحظات العميل",S(o.notes));

    var it=document.createElement("div");it.className="items";it.textContent=S(o.items);
    var sp=stepper(o.status,col);

    var ct=document.createElement("div");ct.className="ctl";
    var sel=document.createElement("select");sel.setAttribute("aria-label","حالة الطلب");
    ST.forEach(function(x){var op=document.createElement("option");op.textContent=x;op.value=x;if(x===o.status)op.selected=true;sel.appendChild(op)});
    var dy=document.createElement("input");dy.type="number";dy.min="0";dy.placeholder="أيام التوصيل";dy.value=S(o.days);dy.setAttribute("aria-label","عدد أيام التوصيل");
    var nt=document.createElement("input");nt.className="nt";nt.placeholder="ملاحظة للعميل";nt.value=S(o.note);nt.setAttribute("aria-label","ملاحظة للعميل");
    var sv=document.createElement("button");sv.type="button";sv.className="save";sv.textContent="حفظ";
    var wa=document.createElement("button");wa.type="button";wa.className="wa";wa.textContent="ابعت للعميل واتساب";

    sv.onclick=function(){
      sv.disabled=true;sv.textContent="جاري الحفظ...";
      api(SCRIPT_URL,{method:"POST",body:JSON.stringify({action:"update",key:key,code:o.code,status:sel.value,days:dy.value,note:nt.value})})
        .then(function(j){
          if(!j||!j.ok)throw 0;
          o.status=sel.value;o.days=dy.value;o.note=nt.value;toast("تم الحفظ ✓");draw();
        })
        .catch(function(){sv.disabled=false;sv.textContent="حفظ";toast("الحفظ فشل، حاول تاني",true)});
    };
    wa.onclick=function(){
      var p=S(o.phone).replace(/\D/g,"");if(p.charAt(0)==="0")p="20"+p.slice(1);
      var msg="أهلاً "+S(o.name)+"، طلبك رقم "+S(o.code)+" من لورا ونتر حالته: "+sel.value+"."+(dy.value&&sel.value!=="تم التسليم"&&sel.value!=="ملغي"?" هيوصلك خلال "+dy.value+" أيام.":"")+(nt.value?" "+nt.value:"")+"\nتتابع طلبك من الموقع بالرقم ده وآخر ٤ أرقام من موبايلك.";
      window.open("https://wa.me/"+p+"?text="+encodeURIComponent(msg),"_blank","noopener");
    };
    ct.append(sel,dy,nt,sv,wa);
    d.append(t,m,it,sp,ct);L.appendChild(d);
  });
}

function skeleton(){var L=$("list");L.innerHTML="";for(var i=0;i<3;i++){var s=document.createElement("div");s.className="sk";L.appendChild(s)}}

/* ===== دخول / خروج ===== */
function enter(){
  $("loginWrap").hidden=true;$("app").hidden=false;stopSnow();window.scrollTo(0,0);
}
function leave(){
  key="";all=[];cur="";$("k").value="";$("q").value="";$("err").textContent="";$("err").className="";
  $("app").hidden=true;$("loginWrap").hidden=false;startSnow();$("k").focus();
}
$("login").onsubmit=function(e){
  e.preventDefault();
  var err=$("err"),go=$("go");
  if(!SCRIPT_URL){err.className="bad";err.textContent="لازم تحط SCRIPT_URL في الملف الأول.";return}
  key=$("k").value.trim();err.className="";err.textContent="جاري التحقق...";go.disabled=true;
  load().then(function(){err.textContent="";go.disabled=false;enter()})
    .catch(function(x){
      go.disabled=false;err.className="";void err.offsetWidth;err.className="bad";
      err.textContent=((x&&x.kind==="auth")?"كلمة السر غلط، جرّب تاني.":"مش قادر أوصل للسيرفر. اتأكد من النت ومن إن Apps Script منشور لـ «أي شخص».")+"\n["+(x&&x.detail||x)+"]";
    });
};
$("eye").onclick=function(){var k=$("k"),h=k.type==="password";k.type=h?"text":"password";this.textContent=h?"🙈":"👁"};
$("rf").onclick=function(){
  var b=$("rf");b.disabled=true;b.classList.add("spin");
  load().then(function(){toast("تم التحديث ✓")}).catch(function(){toast("فشل التحديث",true)})
    .then(function(){b.disabled=false;b.classList.remove("spin")});
};
$("lo").onclick=leave;
$("q").oninput=draw;

/* ===== تلج متحرك لشاشة الدخول ===== */
var cv=$("snow"),cx=cv.getContext("2d"),fl=[],raf=0,W,H;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
function mk(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.6+.6,v:Math.random()*.9+.35,s:Math.random()*Math.PI*2}}
function tick(){
  cx.clearRect(0,0,W,H);cx.fillStyle="rgba(255,255,255,.8)";
  fl.forEach(function(f){
    f.y+=f.v;f.s+=.012;f.x+=Math.sin(f.s)*.5;
    if(f.y>H+5){f.y=-5;f.x=Math.random()*W}
    cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill();
  });
  raf=requestAnimationFrame(tick);
}
function startSnow(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  cv.hidden=false;size();fl=[];for(var i=0;i<90;i++)fl.push(mk());cancelAnimationFrame(raf);tick();
}
function stopSnow(){cancelAnimationFrame(raf);cv.hidden=true}
addEventListener("resize",function(){if(!cv.hidden)size()});
startSnow();
</script>
